services:
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - django_school_static:/app/staticfiles
      - django_school_media:/app/media

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    volumes:
      - django_school_media:/app/media
      - django_school_static:/app/staticfiles

  postgres:
    image: postgres:16
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - django_school_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  django_school_media:
  django_school_static:
  django_school_pgdata:
