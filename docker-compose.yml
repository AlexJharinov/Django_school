services:

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - django_school_media:/app/media

  celery:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres

  celery_beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - django_school_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  django_school_media:
  django_school_pgdata:
