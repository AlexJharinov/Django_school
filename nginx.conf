user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    sendfile      on;

    upstream django_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # STATIC
        location /static/ {
            alias /app/staticfiles/;
        }

        # MEDIA
        location /media/ {
            alias /app/media/;
        }

        # DJANGO
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
